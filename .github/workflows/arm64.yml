name: Build Release (arm64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.keystore"

      - name: Build release APK (arm64-v8a)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/app.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -Pabi=arm64-v8a --stacktrace

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "unknown")
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/ShortTV-${VERSION}-arm64-v8a-release.apk"
          ls -l dist

      - name: Upload to GitHub Release (tag builds only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          files: dist/*.apk
