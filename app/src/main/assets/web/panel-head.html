<style>
/* 两个网页面板共用（幕光方案第 13 章）。组件名与尺寸沿用设计稿 docs/design/cinematic-expressive-redesign.html，
   颜色只用 token（--primary、--sc-high…），色值由电视在 THEME_CSS 里注入。不加载任何外网资源。 */
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;background:var(--surface);color:var(--on-surface);
  font:400 14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.ic{width:20px;height:20px;fill:currentColor;flex:none}
.mu{color:var(--on-surface-variant)}
.pr{color:var(--primary)}
.f1{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono","Noto Sans Mono",monospace}

/* 品牌标：Cookie9Sided + ShortTV */
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:30px;height:30px;flex:none;background:var(--primary);clip-path:var(--sh-cookie9,circle(50%))}
.brand b{font-size:16px;line-height:24px;font-weight:800}

/* Chip：32 高 12 圆角；.sm 26 高 8 圆角（连接状态 Chip 与电视扫码卡一致） */
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:12px;max-width:100%;
  background:var(--sc-high);color:var(--on-surface-variant);font-size:13px;line-height:16px;font-weight:500;white-space:nowrap;flex:none}
.chip .ic{width:18px;height:18px}
.chip.sm{height:26px;padding:0 9px;font-size:12px;border-radius:8px}
.chip.sm .ic{width:16px;height:16px}
.chip.on{background:var(--primary-container);color:var(--on-primary-container);font-weight:700}
.chip.sec{background:var(--secondary-container);color:var(--on-secondary-container)}
.chip.ter{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.chip.err{background:var(--error-container);color:var(--on-error-container)}
.chip.wrap{height:auto;min-height:26px;padding-top:5px;padding-bottom:5px;white-space:normal;align-items:flex-start}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}

/* 按钮：交互面 12 圆角（大号 16）；悬停 / 按下叠 8% / 12% 状态层 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:12px;
  font-size:15px;line-height:1;font-weight:600;background:var(--sc-high);color:var(--on-surface);white-space:nowrap;flex:none;
  -webkit-user-select:none;user-select:none}
.btn.t{background:var(--primary-container);color:var(--on-primary-container)}
.btn.f{background:var(--primary);color:var(--on-primary)}
.btn.x{background:transparent;color:var(--primary)}
.btn.lg{height:56px;border-radius:16px;font-size:16px;padding:0 28px}
.btn.sm{height:36px;padding:0 14px;font-size:13px;border-radius:10px}
.btn.sm .ic{width:18px;height:18px}
.btn:disabled{opacity:.6;cursor:default}
@media (hover:hover){
  .btn:hover,.tap:hover{box-shadow:inset 0 0 0 100vmax color-mix(in srgb,currentColor 8%,transparent)}
}
.btn:active,.tap:active{box-shadow:inset 0 0 0 100vmax color-mix(in srgb,currentColor 12%,transparent)}

/* 输入面：surfaceContainerHigh 底、16 圆角，聚焦描 2px primary */
.field{display:flex;flex-direction:column;gap:4px;border-radius:16px;background:var(--sc-high);padding:12px 16px;color:var(--on-surface);cursor:text}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--primary)}
.field .lbl{font-size:12px;line-height:16px;font-weight:600;color:var(--primary)}
.field textarea{display:block;width:100%;border:0;outline:none;background:transparent;resize:vertical;font-size:13px;line-height:1.55;word-break:break-all}
::placeholder{color:var(--on-surface-variant);opacity:.75}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<script>
/* MaterialShapes 近似（极坐标 + 两遍平滑，与设计稿同一公式）→ clip-path 变量 --sh-*。在 head 里同步执行，首帧即有形状。 */
(function(){
  var NP=120,PI=Math.PI,st=document.documentElement.style,S={
    cookie4:function(t){return .9+.1*Math.cos(4*t)},
    cookie9:function(t){return .94+.06*Math.cos(9*t)},
    softburst:function(t){return .84+.16*Math.cos(10*t)}
  };
  function smooth(a){return a.map(function(_,i){var s=0;for(var d=-3;d<=3;d++)s+=a[(i+d+NP)%NP];return s/7})}
  for(var k in S){
    var a=[];
    for(var i=0;i<NP;i++)a.push(S[k](i/NP*PI*2));
    a=smooth(smooth(a));
    var mx=Math.max.apply(null,a);
    st.setProperty('--sh-'+k,'polygon('+a.map(function(v,j){
      var r=v/mx,t=j/NP*PI*2-PI/2;
      return (50+50*r*Math.cos(t)).toFixed(2)+'% '+(50+50*r*Math.sin(t)).toFixed(2)+'%';
    }).join(',')+')');
  }
})();
</script>
